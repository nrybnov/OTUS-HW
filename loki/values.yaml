loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: s3
    bucketNames:
      chunks: minio
      ruler: minio
      admin: minio
    s3:
      endpoint: storage-minio.svc.cluster.local:9000/kubernetes-logging
      accessKeyId: P3MLub31P3I9Qd8YeRst
      secretAccessKey: C7jPKq1pI1BiPDHhAcW17D6on0KqftCmMKQhH5hc
      s3ForcePathStyle: false
      insecure: true
  schemaConfig:
    configs:
    - from: 2024-04-26
      object_store: s3
      store: tsdb
      schema: v13
      index:
        prefix: index_
        period: 24h
