apiVersion: v1
kind: Namespace
metadata:
  name: storage-minio
  labels:
    name: storage-minio
    
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc001-minio
  namespace: storage-minio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: "second-nfs-client"
  
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: storage-minio
  labels:
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      containers:
        - name: minio
          image: rybnovn/minio:1.0
          volumeMounts:
            - name: minio-data
              mountPath: "/minio/data"
      
          ports:
            - containerPort: 9000
              name: http-data
            - containerPort: 9001
              name: http-admin         
              
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: pvc001-minio
                
              


---

apiVersion: v1
kind: Service
metadata:
  namespace: storage-minio
  name: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  ports:
    - port: 9000
      targetPort: 9000
      name: http-data
    - port: 9001
      targetPort: 9001
      name: http-admin       
  selector:
    app.kubernetes.io/name: minio
  type: ClusterIP 

              
              
              
              