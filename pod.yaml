---
apiVersion: v1
kind: Pod
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  containers:
  - name: web
    image: kyos0109/nginx-distroless:1.18.0
    ports:
    - containerPort: 80
---

apiVersion: v1
kind: Service
metadata:
  namespace: default
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  ports:
    - port: 80
      targetPort: 80      
  selector:
    app.kubernetes.io/name: web
  type: ClusterIP 